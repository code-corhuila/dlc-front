# Real Gateway integration (C06): joins the shared platform network, forwards /api/v1 to
# dlc-api-gateway unchanged and publishes the Auth deployment data (C05). Use with:
#   AUTH_CONFIG_FILE=/path/auth-config.json \
#   docker compose -f deploy/compose.yml -f deploy/compose.gateway.yml up -d
# The mock profile is not needed; the gateway, IAM and owner APIs run from their repositories.
services:
  dlc-front:
    environment:
      # The compositor strips /api/v1 before proxying, so the real Gateway base keeps it.
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-http://dlc-api-gateway:8080/api/v1}
    volumes:
      # {issuer, audience} matching IAM_JWT_ISSUER and IAM_JWT_AUDIENCE of the same stage.
      - ${AUTH_CONFIG_FILE:?Set AUTH_CONFIG_FILE to this stage's auth-config.json}:/usr/share/nginx/auth/auth-config.json:ro
    networks:
      - platform

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK:-platform}
