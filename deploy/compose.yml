# Compositor deployment: proxies /api/v1 to the real dlc-api-gateway on the platform network and
# the portal containers started from their repositories. Requires AUTH_CONFIG_FILE (C05).
name: dlc-front

services:
  dlc-front:
    container_name: dlc-front
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      IAM_UPSTREAM: ${IAM_UPSTREAM:-http://iam-portal-demo}
      PATIENT_UPSTREAM: ${PATIENT_UPSTREAM:-http://patient-portal-demo}
      CLINICAL_UPSTREAM: ${CLINICAL_UPSTREAM:-http://clinical-portal-dlc-front}
      APPOINTMENTS_UPSTREAM: ${APPOINTMENTS_UPSTREAM:-http://appointments-portal-demo}
      BILLING_UPSTREAM: ${BILLING_UPSTREAM:-http://billing-portal-demo}
      # The compositor strips /api/v1 before proxying, so the Gateway base keeps it.
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-http://dlc-api-gateway:8080/api/v1}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - '${FRONT_PORT:-8080}:80'
    volumes:
      # Deployment data: the portal registry.
      - ../fixtures:/usr/share/nginx/deployment:ro
      # {issuer, audience} matching IAM_JWT_ISSUER and IAM_JWT_AUDIENCE of the same stage.
      - ${AUTH_CONFIG_FILE:?Set AUTH_CONFIG_FILE to this stage's auth-config.json}:/usr/share/nginx/auth/auth-config.json:ro
    networks:
      - default
      - clinical
      - appointments
      - billing
      - patient
      - platform

networks:
  # Created by the independently deployed Patients portal.
  patient:
    external: true
    name: ${PATIENT_NETWORK:-dlc-patient-portal_default}
  # Created by dlc-clinical-portal's compose (container clinical-portal-dlc-front): start it first.
  clinical:
    external: true
    name: ${CLINICAL_NETWORK:-dlc-clinical-portal_default}

  # Created by dlc-appointments-portal's compose.
  appointments:
    external: true
    name: ${APPOINTMENTS_NETWORK:-dlc-front}

  # Created by dlc-billing-portal's compose.
  billing:
    external: true
    name: ${BILLING_NETWORK:-dlc-billing-portal_default}

  # Shared network of the real Gateway and owner services (Annex G); create it once with
  # `docker network create platform` if no other stack has.
  platform:
    external: true
    name: ${PLATFORM_NETWORK:-platform}
